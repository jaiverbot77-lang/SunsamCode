      sizes="32x32"
    />
    <title>Sunsam Code</title>
    <script>
      (() => {
        // Bugfix: Web 远控跨 workspace 跳转时，JS bundle 还没执行前就会先渲染启动壳。
        // 这里提前按本地主题偏好决定首屏底色，避免 dark 用户在这一帧看到白底闪烁。
        const STORAGE_KEY = "zcode-theme";
        const DEFAULT_THEME = "zai-dark";
        const BROWSER_THEME_COLORS = {
          dark: "#161616",
          light: "#f8f8f8",
        };
        const BOOTSTRAP_SNAPSHOT_KEY = "zcode:web-remote-control:bootstrap-shell";

        const normalizeResolvedTheme = (theme) => {
          if (theme === "dark") return "dark";
          if (theme === "light") return "light";
          if (theme === "zai-dark") return "dark";
          if (theme === "zai-light") return "light";
          return theme;
        };

        const syncBrowserThemeSurface = (theme) => {
          document.documentElement.setAttribute("data-zcode-browser-theme-surface", theme);
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", BROWSER_THEME_COLORS[theme]);
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", theme);
        };

        try {
          let bootstrapTheme = null;
          const bootstrapSnapshotRaw = window.sessionStorage.getItem(BOOTSTRAP_SNAPSHOT_KEY);
          if (bootstrapSnapshotRaw) {
            window.sessionStorage.removeItem(BOOTSTRAP_SNAPSHOT_KEY);
            try {
              const snapshot = JSON.parse(bootstrapSnapshotRaw);
              if (snapshot && typeof snapshot === "object") {
                const normalizedTheme = snapshot.theme === "dark" ? "dark" : "light";
                bootstrapTheme = normalizedTheme;
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-bg",
                  typeof snapshot.background === "string"
                    ? snapshot.background
                    : normalizedTheme === "dark"
                      ? "#0f172a"
                      : "#f8fafc",
                );
                document.documentElement.style.setProperty(
                  "--zcode-bootstrap-fg",
                  typeof snapshot.foreground === "string"
                    ? snapshot.foreground
                    : normalizedTheme === "dark"
                      ? "#e2e8f0"
                      : "#334155",
                );
                if (typeof snapshot.border === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-border",
                    snapshot.border,
                  );
                }
                if (typeof snapshot.card === "string") {
                  document.documentElement.style.setProperty(
                    "--zcode-bootstrap-card",
                    snapshot.card,
                  );
                }
              }
            } catch {
              // ignore invalid snapshot
            }
          }

          const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_THEME;
          const resolved =
            saved === "system"
              ? window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : normalizeResolvedTheme(saved);
          const fallbackTheme = resolved === "dark" ? "dark" : "light";
          const finalTheme = bootstrapTheme ?? fallbackTheme;
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", finalTheme);
          syncBrowserThemeSurface(finalTheme);
          if (finalTheme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch {
          document.documentElement.setAttribute("data-zcode-bootstrap-theme", "dark");
          syncBrowserThemeSurface("dark");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      html[data-zcode-bootstrap-theme="light"] body {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      html[data-zcode-browser-theme-surface],
      html[data-zcode-browser-theme-surface] body,
      html[data-zcode-browser-theme-surface] #root {
        /* 修复原因：共享 UI 样式为 Electron vibrancy 强制透明根背景；浏览器入口必须用语义背景
           覆盖该桌面专属行为，否则浏览器工具栏、overscroll 和页面画布会回退为系统白色。 */
        background: var(--color-background, var(--zcode-bootstrap-bg, #161616)) !important;
      }

      html[data-zcode-browser-theme-surface="light"],
      html[data-zcode-browser-theme-surface="light"] body,
      html[data-zcode-browser-theme-surface="light"] #root {
        background: var(--color-background, var(--zcode-bootstrap-bg, #f8f8f8)) !important;
      }

      .zcode-boot-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        /* Bugfix: UI 全局样式会把 body/#root 置为透明，预渲染壳必须自己承接主题背景，否则深色主题会露出浏览器白底。 */
        background: var(--zcode-bootstrap-bg, var(--color-background, #0f172a));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #e2e8f0));
      }

      html[data-zcode-bootstrap-theme="light"] .zcode-boot-loading {
        background: var(--zcode-bootstrap-bg, var(--color-background, #f8fafc));
        color: var(--zcode-bootstrap-fg, var(--color-foreground, #334155));
      }

      .zcode-boot-loading__logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #1a1622 0%, #100e15 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
      }

      .zcode-boot-loading__logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 修复原因：启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .zcode-boot-loading__logo {
        width: 56px;
        height: auto;
        color: #ffffff;
      }
          /* Sunsam: logo de arranque animado; al cargar React el logo de RootStartupLoading sigue
         solo con el latido (html[data-sunsam-boot-logo]) para no repetir la entrada. */
      .sunsam-boot-mark {
        overflow: visible;
      }
      .sunsam-boot-ray,
      .sunsam-boot-tri {
        transform-box: view-box;
      }
      .sunsam-boot-ray {
        transform-origin: 512px 512px;
        animation:
          sunsam-boot-ray-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.25) both,
          sunsam-boot-ray-pulse 2.4s ease-in-out infinite;
        animation-delay: var(--sunsam-ray-delay), calc(var(--sunsam-ray-delay) + 1.5s);
      }
      .sunsam-boot-tri {
        transform-origin: 517px 488px;
        animation:
          sunsam-boot-tri-in 0.65s cubic-bezier(0.2, 0.8, 0.3, 1.2) 0.55s both,
          sunsam-boot-tri-glow 2.4s ease-in-out 1.8s infinite;
      }
      @keyframes sunsam-boot-ray-in {
        from {
          opacity: 0;
          transform: scale(0.55);
        }
        60% {
          opacity: 1;
          transform: scale(1.08);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes sunsam-boot-ray-pulse {
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes sunsam-boot-tri-in {
        from {
          opacity: 0;
          transform: rotate(-120deg) scale(0);
        }
        60% {
          opacity: 1;
          transform: rotate(-12deg) scale(1.12);
          filter: drop-shadow(0 0 40px rgba(253, 182, 115, 0.85));
        }
        to {
          opacity: 1;
          transform: none;
          filter: drop-shadow(0 0 14px rgba(244, 65, 94, 0.35));
        }
      }
      @keyframes sunsam-boot-tri-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 14px rgba(244, 65, 94, 0.35));
        }
        50% {
          filter: drop-shadow(0 0 30px rgba(253, 182, 115, 0.6));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sunsam-boot-ray,
        .sunsam-boot-tri {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Bugfix: 远程控制跨 workspace 时会整页跳转；在 JS 入口执行前先给出 loading 壳，避免出现白屏空档。 -->
      <div
        class="zcode-boot-loading"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading..."
      >
        <div class="zcode-boot-loading__logo-shell">
          <svg
          xmlns="http://www.w3.org/2000/svg"
          width="116"
          height="100"
          fill="none"
          viewBox="130 180 760 660"
          class="zcode-boot-loading__logo sunsam-boot-mark"
          aria-hidden="true"
        >
          <!-- Sunsam: logo animado (mismo movimiento que packages/ui/src/sunsam/sunsamAnimatedLogo.css). -->
          <defs>
            <linearGradient id="sunsam-boot-tri" x1="383" y1="394" x2="600" y2="640" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FDB673" />
              <stop offset="0.55" stop-color="#F4415E" />
              <stop offset="1" stop-color="#DC447F" />
            </linearGradient>
          </defs>
          <g stroke="#F4F1F7" stroke-width="26" stroke-linecap="round">
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.3s" d="M475 208L489 285" />
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.38s" d="M793 468L870 445" />
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.46s" d="M477 741L487 815" />
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.54s" d="M156 510L228 487" />
          </g>
          <path class="sunsam-boot-tri" d="M383 394L733 442L436 629Z" fill="url(#sunsam-boot-tri)" />
        </svg>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
