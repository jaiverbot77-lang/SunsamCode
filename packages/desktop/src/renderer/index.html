<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunsam Code</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }

      #root {
        opacity: 0;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #root {
        opacity: 1;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.16s ease;
      }

      body.zcode-startup-ready #loading {
        pointer-events: none;
        opacity: 0;
      }

      .startup-logo-shell {
        position: relative;
        display: flex;
        width: 96px;
        height: 96px;
        align-items: center;
        justify-content: center;
        border-radius: 24px;
        background: linear-gradient(180deg, #1a1622 0%, #100e15 100%);
        box-shadow:
          0 20px 25px -5px rgb(0 0 0 / 0.2),
          0 8px 10px -6px rgb(0 0 0 / 0.2);
        transform: scale(0.72);
        opacity: 0;
        animation: startup-logo-pop 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: center;
      }

      .startup-logo-shell::before {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        /* 修复原因：启动 logo 壳是固定深色底，边框不能跟随浅色主题 token，否则首屏边框过重。 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: inherit;
      }

      .startup-logo {
        width: 64px;
        height: auto;
        color: #ffffff;
      }

      @keyframes startup-logo-pop {
        0% {
          opacity: 0;
          transform: scale(0.72);
        }

        38% {
          opacity: 1;
          transform: scale(1.045);
        }

        58% {
          transform: scale(0.985);
        }

        76% {
          transform: scale(1.008);
        }

        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .startup-logo-shell {
          opacity: 1;
          transform: scale(1);
          animation: none;
        }
      }
          /* Sunsam: logo de arranque animado; al cargar React el logo de RootStartupLoading sigue
         solo con el latido (html[data-sunsam-boot-logo]) para no repetir la entrada. */
      .sunsam-boot-mark {
        overflow: visible;
      }
      .sunsam-boot-ray,
      .sunsam-boot-tri {
        transform-box: view-box;
      }
      .sunsam-boot-ray {
        transform-origin: 512px 512px;
        animation:
          sunsam-boot-ray-in 0.5s cubic-bezier(0.2, 0.8, 0.3, 1.25) both,
          sunsam-boot-ray-pulse 2.4s ease-in-out infinite;
        animation-delay: var(--sunsam-ray-delay), calc(var(--sunsam-ray-delay) + 1.5s);
      }
      .sunsam-boot-tri {
        transform-origin: 517px 488px;
        animation:
          sunsam-boot-tri-in 0.65s cubic-bezier(0.2, 0.8, 0.3, 1.2) 0.55s both,
          sunsam-boot-tri-glow 2.4s ease-in-out 1.8s infinite;
      }
      @keyframes sunsam-boot-ray-in {
        from {
          opacity: 0;
          transform: scale(0.55);
        }
        60% {
          opacity: 1;
          transform: scale(1.08);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes sunsam-boot-ray-pulse {
        50% {
          transform: scale(1.06);
        }
      }
      @keyframes sunsam-boot-tri-in {
        from {
          opacity: 0;
          transform: rotate(-120deg) scale(0);
        }
        60% {
          opacity: 1;
          transform: rotate(-12deg) scale(1.12);
          filter: drop-shadow(0 0 40px rgba(253, 182, 115, 0.85));
        }
        to {
          opacity: 1;
          transform: none;
          filter: drop-shadow(0 0 14px rgba(244, 65, 94, 0.35));
        }
      }
      @keyframes sunsam-boot-tri-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 14px rgba(244, 65, 94, 0.35));
        }
        50% {
          filter: drop-shadow(0 0 30px rgba(253, 182, 115, 0.6));
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sunsam-boot-ray,
        .sunsam-boot-tri {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="loading" class="[app-region:drag]" role="status" aria-busy="true" aria-label="Loading...">
      <div class="startup-logo-shell">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="116"
          height="100"
          fill="none"
          viewBox="130 180 760 660"
          class="startup-logo sunsam-boot-mark"
          aria-hidden="true"
        >
          <!-- Sunsam: logo animado (mismo movimiento que packages/ui/src/sunsam/sunsamAnimatedLogo.css). -->
          <defs>
            <linearGradient id="sunsam-boot-tri" x1="383" y1="394" x2="600" y2="640" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#FDB673" />
              <stop offset="0.55" stop-color="#F4415E" />
              <stop offset="1" stop-color="#DC447F" />
            </linearGradient>
          </defs>
          <g stroke="#F4F1F7" stroke-width="26" stroke-linecap="round">
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.3s" d="M475 208L489 285" />
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.38s" d="M793 468L870 445" />
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.46s" d="M477 741L487 815" />
            <path class="sunsam-boot-ray" style="--sunsam-ray-delay: 0.54s" d="M156 510L228 487" />
          </g>
          <path class="sunsam-boot-tri" d="M383 394L733 442L436 629Z" fill="url(#sunsam-boot-tri)" />
        </svg>
      </div>
    </div>
    <script type="module">
      const startupLogoShell = document.querySelector(".startup-logo-shell");
      // Sunsam: la entrada del logo ya se ve aquí; el logo de React (RootStartupLoading) solo late.
      if (startupLogoShell) document.documentElement.dataset.sunsamBootLogo = "1";
      const startupLoading = document.getElementById("loading");
      const isUpdateStatusWindow =
        new URLSearchParams(window.location.search).get("windowKind") === "update-status";
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let finished = false;
      let animationDone = false;
      let reactReady = false;

      // 修复原因：主入口不能依赖动画结束后的动态 import；一旦导入路径在 Electron/Vite 下失败，
      // 页面会永久停在 HTML loading。这里让主入口静态加载，只把启动壳作为动画遮罩延迟移除。
      const tryFinishStartupAnimation = () => {
        if (finished || !animationDone || !reactReady) return;
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        window.setTimeout(() => startupLoading?.remove(), 500);
      };

      const markAnimationDone = () => {
        animationDone = true;
        tryFinishStartupAnimation();
      };

      const markReactReady = () => {
        reactReady = true;
        tryFinishStartupAnimation();
      };

      if (isUpdateStatusWindow) {
        // Bugfix: 更新状态窗口本身就是一个轻量弹窗，复用主入口 HTML 时不应再显示启动壳。
        // 否则透明独立窗口里的启动 logo 会短暂或持续盖在更新按钮上，看起来像弹窗 UI 异常。
        finished = true;
        document.body.classList.add("zcode-startup-ready");
        startupLoading?.remove();
      } else {
        window.addEventListener("zcode-react-startup-ready", markReactReady, { once: true });
      }

      if (isUpdateStatusWindow || reduceMotion || !startupLogoShell) {
        markAnimationDone();
      } else {
        startupLogoShell.addEventListener("animationend", markAnimationDone, { once: true });
        window.setTimeout(markAnimationDone, 1000);
      }

      if (!isUpdateStatusWindow) {
        window.setTimeout(markReactReady, 3000);
      }
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
