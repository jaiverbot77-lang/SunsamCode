name: Request a feature / Solicitar una función
description: Suggest an idea for Sunsam Code. / Propón una idea para Sunsam Code.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What do you need? / ¿Qué necesitas?
      description: The problem or the task you want to do. / El problema o la tarea que quieres hacer.
      placeholder: I want to save prompts I use often while a task runs and insert them later with one click.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Expected solution / Solución esperada
      placeholder: A quick prompts menu next to the editor with actions to create, edit and insert.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered / Alternativas que consideraste
  - type: textarea
    id: context
    attributes:
      label: Extra context, mockups or screenshots / Contexto, bocetos o capturas
